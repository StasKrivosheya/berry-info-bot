services:
  app:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./data/knowledge_base/processed:/app/data/knowledge_base/processed:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
