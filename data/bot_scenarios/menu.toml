# Bot button scenarios.
#
# Managers usually edit:
# - title: button label
# - content_text: Markdown/text file shown after clicking the button
# - content_photos: image files shown after clicking the button
# - children: nested buttons, in display order
# - navigation: optional section navigation buttons for text-only detail pages
# - links: external URL buttons

